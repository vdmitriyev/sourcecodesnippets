version: '3'

vars:
  CONTAINER_NAME: asciinema-tools
  IMAGE_NAME: asciinema-tools:latest

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  build:
    desc: Build the Docker image
    cmds:
      - docker compose build

  up:
    desc: Start the container
    cmds:
      - docker compose up -d

  down:
    desc: Stop and remove the container
    cmds:
      - docker compose down

  restart:
    desc: Restart the container
    cmds:
      - task: down
      - task: up

  shell:
    desc: Open a shell in the container
    cmds:
      - docker compose exec {{.CONTAINER_NAME}} /bin/bash

  logs:
    desc: View container logs
    cmds:
      - docker compose logs -f {{.CONTAINER_NAME}}

  clean:
    desc: Remove container, image, and volumes
    cmds:
      - docker compose down -v
      - docker rmi {{.IMAGE_NAME}} || true

  rebuild:
    desc: Clean and rebuild everything
    cmds:
      - task: clean
      - task: build
      - task: up

  exec:
    desc: Execute a command in the container (usage - task exec -- <command>)
    cmds:
      - docker compose exec {{.CONTAINER_NAME}} {{.CLI_ARGS}}

  status:
    desc: Show container status
    cmds:
      - docker compose ps

  validate:
    desc: Validate docker-compose configuration
    cmds:
      - docker compose config
